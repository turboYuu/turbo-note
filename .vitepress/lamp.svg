<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2"/>
      <stop offset="100%" style="stop-color:#fcb69f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#fff9c4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="30" fill="url(#bg8)"/>
  <!-- Light glow -->
  <ellipse cx="200" cy="120" rx="100" ry="80" fill="url(#glow)"/>
  <!-- Base -->
  <ellipse cx="200" cy="310" rx="55" ry="12" fill="#8d6e63"/>
  <rect x="170" y="260" width="60" height="50" rx="5" fill="#a1887f"/>
  <!-- Pole -->
  <rect x="195" y="140" width="10" height="125" fill="#bdbdbd"/>
  <!-- Shade -->
  <path d="M120 130 L140 60 L260 60 L280 130 Z" fill="#efebe9" stroke="#d7ccc8" stroke-width="2"/>
  <path d="M125 130 L145 65 L255 65 L275 130 Z" fill="none" stroke="#efebe9" stroke-width="3"/>
  <!-- Bulb hint -->
  <circle cx="200" cy="135" r="10" fill="#fff9c4" opacity="0.9"/>
  <!-- Button -->
  <circle cx="200" cy="275" r="6" fill="#6d4c41"/>
  <!-- Stars decoration -->
  <text x="80" y="50" font-size="22">🌙</text>
  <text x="300" y="80" font-size="16">✨</text>
</svg>
